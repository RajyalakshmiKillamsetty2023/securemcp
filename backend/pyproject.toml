[project]
name = "securemcp"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "pymongo>=4.8,<5",
]

[project.optional-dependencies]
ml = ["numpy", "pandas", "scikit-learn", "matplotlib", "sentence-transformers", "datasets"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
